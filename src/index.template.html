<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Fill Command Visualizer v8</title>
    <style>
        :root { --mc-green: #4C7A4A; --mc-green-light: #5DA65B; --mc-green-dark: #3B5E39; }
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background: #1a1a2e; }
        .font-mc { font-family: 'Silkscreen', monospace; }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        .label {
            color: #FFF; font-family: 'Silkscreen', monospace; font-size: 13px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
            padding: 3px 6px; background: rgba(0,0,0,0.6); border-radius: 2px;
        }
        .mc-border {
            border: 3px solid #555;
            border-top-color: #888; border-left-color: #777;
            border-right-color: #333; border-bottom-color: #222;
        }
        .grass-strip {
            height: 6px;
            background: linear-gradient(to bottom, #5DA65B 0%, #5DA65B 50%, #8B6914 50%, #8B6914 100%);
        }

        /* Draggable number input — the core interaction */
        .drag-num {
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.2);
            border-radius: 3px; color: #fff; font-family: 'Silkscreen', monospace;
            font-size: 13px; text-align: center; outline: none;
            width: 3rem; padding: 3px 2px; cursor: ns-resize; user-select: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .drag-num:hover { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.2); }
        .drag-num:focus { cursor: text; border-color: #7ddf7a; background: rgba(255,255,255,0.25); }
        .drag-num.dragging { border-color: #7ddf7a; background: rgba(125,223,122,0.15); }

        /* Panel scrolling */
        #ui-panel { max-height: 100vh; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #4B5563 transparent; }
        #ui-panel::-webkit-scrollbar { width: 5px; }
        #ui-panel::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
    </style>
</head>
<body class="text-white">

<!-- Compact floating panel — bottom right, minimal footprint -->
<div id="ui-panel" class="fixed bottom-3 right-3 z-10 pointer-events-auto bg-[#2a2a3e] bg-opacity-90 backdrop-blur-sm rounded-lg shadow-xl">

    <!-- Title + mode -->
    <div class="bg-[#3a3a52] px-2 py-1 flex items-center justify-between rounded-t-lg gap-2">
        <h1 class="font-mc text-[11px] text-green-300">Fill Visualizer</h1>
        <div class="flex items-center gap-2 text-[10px]">
            <label class="flex items-center gap-1 text-gray-200 cursor-pointer">
                <input type="radio" name="mode" value="world" id="modeWorld" class="accent-green-500 w-3 h-3" checked>
                <span class="font-mc">World</span>
            </label>
            <label class="flex items-center gap-1 text-gray-200 cursor-pointer">
                <input type="radio" name="mode" value="relative" id="modeRelative" class="accent-green-500 w-3 h-3">
                <span class="font-mc">Rel</span>
            </label>
        </div>
    </div>
    <div class="grass-strip" style="height:3px;"></div>

    <div class="p-2 flex flex-col gap-1.5">

        <!-- Shape indicator — inline -->
        <div id="shapeIndicator" class="mc-border px-2 py-1 text-center bg-[#333350]" style="border-width:2px;">
            <span id="shapeLabel" class="font-mc text-sm text-white">Single Block</span>
            <span id="shapeDesc" class="text-[10px] text-gray-300 ml-1">From and To are the same spot</span>
        </div>

        <!-- MakeCode fill block — compact -->
        <div class="mc-border overflow-hidden" style="border-width:2px; border-color: var(--mc-green-dark); border-top-color: var(--mc-green-light); border-left-color: var(--mc-green-light);">

            <div class="px-2 py-1" style="background: var(--mc-green);">
                <span class="font-mc text-[11px] text-green-100">fill with</span>
            </div>

            <!-- Column headers -->
            <div class="grid grid-cols-[2.5rem_2.2rem_1fr_1fr_1fr] gap-1 px-2 py-1 items-end" style="background: var(--mc-green-dark);">
                <div></div><div></div>
                <div class="text-center"><div class="font-mc text-[11px] text-red-400">X</div><div class="font-mc text-[9px] text-red-300">W- E+</div></div>
                <div class="text-center"><div class="font-mc text-[11px] text-green-400">Y</div><div class="font-mc text-[9px] text-green-300">Dn- Up+</div></div>
                <div class="text-center"><div class="font-mc text-[11px] text-blue-400">Z</div><div class="font-mc text-[9px] text-blue-300">N- S+</div></div>
            </div>

            <!-- FROM -->
            <div class="grid grid-cols-[2.5rem_2.2rem_1fr_1fr_1fr] gap-1 px-2 py-1.5 items-center" style="background: var(--mc-green-dark);">
                <span class="font-mc text-xs text-cyan-300">from</span>
                <span id="mk-from-mode" class="font-mc text-[10px] text-green-300"></span>
                <div class="flex justify-center"><span id="mk-from-x-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-from-x" type="text" inputmode="numeric" value="0" class="drag-num" data-slider="x1" /></div>
                <div class="flex justify-center"><span id="mk-from-y-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-from-y" type="text" inputmode="numeric" value="-60" class="drag-num" data-slider="y1" data-is-y="true" /></div>
                <div class="flex justify-center"><span id="mk-from-z-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-from-z" type="text" inputmode="numeric" value="0" class="drag-num" data-slider="z1" /></div>
            </div>

            <div class="h-[1px]" style="background: var(--mc-green);"></div>

            <!-- TO -->
            <div class="grid grid-cols-[2.5rem_2.2rem_1fr_1fr_1fr] gap-1 px-2 py-1.5 items-center" style="background: var(--mc-green-dark);">
                <span class="font-mc text-xs text-yellow-300">to</span>
                <span id="mk-to-mode" class="font-mc text-[10px] text-green-300"></span>
                <div class="flex justify-center"><span id="mk-to-x-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-to-x" type="text" inputmode="numeric" value="0" class="drag-num" data-slider="x2" /></div>
                <div class="flex justify-center"><span id="mk-to-y-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-to-y" type="text" inputmode="numeric" value="-60" class="drag-num" data-slider="y2" data-is-y="true" /></div>
                <div class="flex justify-center"><span id="mk-to-z-prefix" class="font-mc text-[10px] text-green-300"></span><input id="mk-to-z" type="text" inputmode="numeric" value="0" class="drag-num" data-slider="z2" /></div>
            </div>
        </div>

        <!-- Ground Y -->
        <div id="groundRow" class="flex items-center gap-2">
            <label for="groundLevel" class="font-mc text-[10px] text-gray-400">Ground Y:</label>
            <input id="groundLevel" type="text" inputmode="numeric" pattern="-?[0-9]*" value="-60"
                class="drag-num w-14" data-ground="true" />
        </div>

    </div>
</div>

<!-- Hidden range inputs — sliders are now invisible, just used as state -->
<div style="display:none;">
    <input type="range" id="x1" min="0" max="63" value="0">
    <input type="range" id="y1" min="0" max="63" value="0">
    <input type="range" id="z1" min="0" max="63" value="0">
    <input type="range" id="x2" min="0" max="63" value="0">
    <input type="range" id="y2" min="0" max="63" value="0">
    <input type="range" id="z2" min="0" max="63" value="0">
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
